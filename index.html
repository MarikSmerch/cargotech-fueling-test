<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6200">
  <title>Заправка в рейсе — CargoTech</title>
  <style>
    :root{color-scheme:light;--orange:#ff6200;--orange-dark:#da5200;--soft:#fff0e5;--ink:#18202b;--muted:#687385;--gray:#f5f6f8;--border:#e6e9ee;--green:#16834a;--red:#bf3636}
    *{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9ebef;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,input:focus-visible{outline:3px solid #005bcc;outline-offset:2px}
    .phone{width:min(100%,430px);min-height:100dvh;margin:0 auto;background:white;position:relative;display:flex;flex-direction:column;box-shadow:0 15px 38px #17202a0d}#app{display:flex;flex-direction:column;flex:1}.bar{height:8px;background:var(--orange)}.top{padding:18px 22px 10px;display:flex;align-items:center;gap:12px}.back{border:0;background:var(--gray);border-radius:12px;width:48px;height:48px;font-size:22px;flex:none}.top-label{font-size:13px;color:var(--muted)}.top-name{font-size:15px;font-weight:700}.signal{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}.signal.bad{color:var(--red)}.main{padding:8px 22px 30px;flex:1}.foot{position:sticky;bottom:0;background:#fff;padding:12px 22px max(22px,env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:2}.foot .btn+.btn{margin-top:10px}.title{font-size:29px;line-height:1.12;letter-spacing:-.8px;margin:13px 0 19px;font-weight:780}.subtitle{font-size:19px;font-weight:750;margin:22px 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.bold{font-weight:700}.big{font-size:36px;font-weight:780;letter-spacing:-1.3px;line-height:1.15}.card{background:var(--gray);border-radius:18px;padding:18px;margin:0 0 12px}.white-card{border:1px solid var(--border);background:#fff}.route{font-weight:750;font-size:22px;margin:9px 0}.space{display:flex;justify-content:space-between;align-items:center;gap:12px}.vcenter{display:flex;align-items:center;gap:8px}.pill{border-radius:100px;background:var(--soft);color:#ad4b08;font-weight:700;padding:5px 10px;font-size:12px}.pill.ok{background:#e7f7ee;color:var(--green)}.pill.gray{background:#e8ebef;color:#637081}.pill.bad{background:#ffebeb;color:#b73b3b}.progressbar{height:7px;background:#e0e5eb;overflow:hidden;border-radius:30px;margin-top:13px}.progressbar>span{height:100%;display:block;background:var(--orange);border-radius:30px;transition:width .3s}.btn{width:100%;border:0;border-radius:100px;min-height:56px;padding:12px 19px;background:var(--orange);color:white;font-weight:760;font-size:16px;text-align:center}.btn:hover:not(:disabled){background:var(--orange-dark)}.btn.alt{background:var(--gray);color:var(--ink)}.btn.alt:hover:not(:disabled){background:#e7e9ee}.btn.light{background:var(--soft);color:#ab4500}.note{display:flex;gap:11px;align-items:flex-start;background:#f8f9fb;border:1px solid var(--border);padding:14px;border-radius:14px;margin:13px 0;font-size:14px}.note.orange{background:#fff8f3;border-color:#ffdfc6}.note.red{background:#fff1f1;border-color:#ffd6d6}.note .sym{flex:none;color:var(--orange);font-size:18px}.note.red .sym{color:var(--red)}.steps{font-size:13px;color:var(--muted);font-weight:650}.station-item,.choice{border:1px solid var(--border);border-radius:16px;background:white;display:block;width:100%;text-align:left;padding:15px;margin:9px 0;min-height:60px;color:var(--ink)}.station-item:hover,.choice:not(:disabled):hover{border-color:var(--orange)}.choice.selected{border:2px solid var(--orange);background:#fff8f3;padding:14px}.choice:disabled{background:#f7f8fa;color:#8a929b}.list-top{display:flex;justify-content:space-between;gap:9px;align-items:start}.station-title{font-size:17px;font-weight:750;line-height:1.24}.price{font-size:17px;font-weight:800;white-space:nowrap}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice .muted{font-size:12px;margin-top:5px}.field{width:100%;border:2px solid var(--border);border-radius:14px;height:60px;padding:8px 15px;font-size:28px;font-weight:750;background:white;color:var(--ink)}.stepper{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:9px}.sq{width:62px;height:60px;border-radius:14px;border:1px solid var(--border);background:var(--gray);font-size:29px;font-weight:600}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.quick button{min-height:43px;border:1px solid var(--border);background:white;border-radius:12px;padding:8px 13px;font-size:14px}.divider{height:1px;background:var(--border);margin:17px 0}.sumrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:15px}.sumrow span:first-child{color:var(--muted)}.sumrow strong{font-size:16px;text-align:right}.center{text-align:center;padding:28px 0 8px}.symbol{display:inline-grid;place-items:center;background:#e8f8ee;color:var(--green);border-radius:50%;width:83px;height:83px;font-size:43px;font-weight:750}.symbol.wait{background:var(--soft);color:var(--orange)}.symbol.fail{background:#ffebeb;color:var(--red)}.helper{border:0;background:transparent;color:#824015;text-decoration:underline;font-size:14px;text-align:left;padding:7px 0 12px;min-height:43px}.search{height:50px;width:100%;border:1px solid var(--border);border-radius:13px;padding:0 13px;background:#fff;margin:5px 0 8px;font-size:15px}.tabs{display:flex;gap:7px;margin:7px 0 13px}.tabs button{border:1px solid var(--border);background:var(--gray);border-radius:100px;padding:11px 13px;font-size:13px;font-weight:700;min-height:44px}.tabs button.active{background:var(--soft);color:#b65413;border-color:#fbc8a3}.loading{border:4px solid var(--soft);border-top-color:var(--orange);height:42px;width:42px;margin:32px auto 16px;border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fill{height:13px;background:#e7ebf0;border-radius:9px;overflow:hidden}.fill span{display:block;height:100%;background:var(--orange);border-radius:9px;transition:width .3s}.counter{font-size:37px;font-weight:800;letter-spacing:-1px}.foot-label{font-size:12px;color:var(--muted);text-align:center;margin-top:9px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media(min-width:540px){body{padding:28px 0}.phone{min-height:844px;border-radius:27px;overflow:hidden}.foot{position:sticky}}
    @media(prefers-reduced-motion:reduce){.loading{animation:none}.fill span,.progressbar>span{transition:none}}
  </style>
</head>
<body>
  <div class="phone"><div class="bar"></div><div id="app" ><main class="main"><div class="loading"></div><p class="muted" style="text-align:center">Загружаем рейс…</p></main></div></div>
  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
